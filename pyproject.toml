[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2"]

[project]
name = "zarr-lint"
description = "Inspect Zarr stores for structural and metadata problems."
readme = "README.md"
license = "BSD-3-Clause"
authors = [{ name = "Dave Bunten" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# The version is derived from the Cargo workspace package version by maturin.
# Do not add a static version here; see docs/versioning.md.
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/d33bs/zarr-lint"

[project.scripts]
zarr-lint = "zarr_lint.cli:main"

[tool.maturin]
module-name = "zarr_lint._native"
python-source = "src"
manifest-path = "crates/zarr-lint-python/Cargo.toml"
features = ["pyo3/extension-module"]
include = [{ path = "LICENSE", format = "sdist" }]

[dependency-groups]
dev = [
  "maturin>=1.9,<2",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
