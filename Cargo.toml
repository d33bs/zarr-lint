[workspace]
members = [
  "crates/zarr-lint-cli",
  "crates/zarr-lint-core",
]
resolver = "2"

# The workspace package version is the single source of truth for the project
# version. Every crate below inherits it with `version.workspace = true`, and the
# CLI reads it at compile time via `env!("CARGO_PKG_VERSION")`. Do not hard-code
# the version anywhere else; the release workflow keeps this value and the git
# tag in agreement.
[workspace.package]
version = "0.0.1"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/d33bs/zarr-lint"
rust-version = "1.82"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"

# Dev-only dependencies shared across crates.
tempfile = "3.23"
