[package]
name = "zarr-lint-python"
description = "Python bindings for zarr-lint."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
zarr-lint-core = { path = "../zarr-lint-core" }
zarr-lint-cli = { path = "../zarr-lint-cli" }
serde_json.workspace = true
# `abi3-py311` builds a single forward-compatible wheel for CPython 3.11+.
pyo3 = { workspace = true, features = ["extension-module", "abi3-py311"] }
