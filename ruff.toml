# Ruff configuration for zarr-lint's Python helper scripts under tools/.
# The project is Rust; these scripts only support versioning and fixture
# generation, so the lint surface is kept small and deterministic.
line-length = 88
target-version = "py39"

[lint]
# Pyflakes (F) plus the logical-error subset of pycodestyle (E4/E7/E9). This is
# ruff's documented default, pinned explicitly so results do not drift with
# ruff's version.
select = ["E4", "E7", "E9", "F"]
