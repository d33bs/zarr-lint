---
# Build wheels + sdist and publish to PyPI when a GitHub release is published.
#
# The release tag drives the version: `tools/sync_release_version.py` rewrites
# the Cargo workspace version to match the tag in each build checkout (an
# ephemeral edit, never committed), and maturin derives the wheel version from
# that synced Cargo version. The committed Cargo.toml version is only a
# development placeholder and is not expected to track releases.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored.
# One-time setup on PyPI (done by a maintainer): add a trusted publisher for
# this repository with workflow `publish-pypi.yml` and environment `pypi`.
name: publish pypi

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Bound to an env var (not interpolated into the shell) to avoid template
  # injection from an attacker-controlled tag name.
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  # Gate: validate the release tag and that the workspace version can be synced
  # to it. The build jobs below repeat the sync in their own checkouts.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync version from release tag
        shell: bash
        run: python tools/sync_release_version.py "$RELEASE_TAG"

  wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: macos-14
            target: aarch64
          - runner: macos-14
            target: x86_64
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync version from release tag
        shell: bash
        run: python tools/sync_release_version.py "$RELEASE_TAG"
      # abi3 (see the pyo3 crate) yields a single forward-compatible wheel per
      # platform for CPython 3.11+.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          # Caching is intentionally disabled in release-artifact builds to
          # avoid cache-poisoning of published wheels.
          sccache: "false"
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sync version from release tag
        shell: bash
        run: python tools/sync_release_version.py "$RELEASE_TAG"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      # Mandatory for PyPI Trusted Publishing (OIDC).
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
