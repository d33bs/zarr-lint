---
# Keeps a draft GitHub release up to date with notes from merged pull requests,
# so there is always a release ready to publish.
# See: https://github.com/release-drafter/release-drafter
#
# Publishing that draft fires `release: published`, which triggers release.yml
# (binaries) and publish-pypi.yml (wheels). The release tag drives the version:
# those workflows run `tools/sync_release_version.py` to rewrite the workspace
# version to match the tag at build time, so no manual Cargo.toml bump is
# required before publishing.
name: release drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  draft_release:
    permissions:
      # Required to create and update the draft release.
      contents: write
      # Required for the autolabeler; read is enough without it.
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: release-drafter/release-drafter@v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
