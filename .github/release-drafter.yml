---
# Configuration for Release Drafter, which keeps a draft GitHub release
# continuously updated with notes from merged pull requests, so a release is
# always ready to publish.
# See: https://github.com/release-drafter/release-drafter
#
# The resolved version drives the draft's suggested name and tag. The committed
# Cargo workspace version is only a development placeholder; the release
# workflows run `tools/sync_release_version.py` to rewrite it to match the
# draft's tag at build time, so no manual Cargo.toml bump is required before
# publishing (see docs/versioning.md).
name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
      - 'release-major'
  minor:
    labels:
      - 'release-minor'
  patch:
    labels:
      - 'release-patch'
  default: patch
change-template: '- $TITLE (@$AUTHOR via #$NUMBER)'
change-title-escapes: '\<*_&'
template: |
  ## Changes

  $CHANGES
